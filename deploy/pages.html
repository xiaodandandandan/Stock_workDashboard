<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>缠论全市场扫描 · 历史展示</title>
<style>body{font:15px system-ui;background:#f4f6f9;color:#243047;margin:0;padding:20px}main{max-width:1400px;margin:auto}h1{font-size:24px}section{background:white;padding:16px;border-radius:12px;margin:16px 0}label{display:inline-block;margin:6px}select,input,button{font:inherit;padding:8px;border:1px solid #ccd3df;border-radius:6px;max-width:100%}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:12px;text-align:center;border-bottom:1px solid #eee}th{background:#f6f8fc}small,.hint{color:#68758c;line-height:1.8}dialog{max-width:700px;width:85%;border:0;border-radius:12px}pre{white-space:pre-wrap;word-break:break-word}tr[data-row]{cursor:pointer}button{cursor:pointer}</style>
<main><h1>缠论全市场扫描</h1><section><b>预先扫描结果展示版</b><p class="hint">数据固定于所选扫描批次，不是实时行情。支持筛选和查看扫描时保存的信号判据；在线扫描、最新报价、K线及基本面按需分析暂不提供。后续服务器版将保留完整功能。</p><div id="meta">正在加载扫描目录…</div></section>
<section><label>扫描批次 <select id="batch"></select></label><label>上市板块 <select id="board"><option value="">全部板块</option><option value="main">主板（沪深）</option><option value="star">科创板</option><option value="growth">创业板</option><option value="bse">北交所</option></select></label><label>信号 <select id="signal"><option value="">全部信号</option><option>一类买点</option><option>二类买点</option><option>三类买点</option><option>一类卖点</option><option>二类卖点</option><option>三类卖点</option></select></label><label>新鲜度 <select id="fresh"><option value="99">不限</option><option value="0">仅当日新报出</option><option value="1">近2根K线</option><option value="4">近5根K线</option></select></label><label>行业 <select id="industry"><option value="">全部行业</option></select></label><label>搜索 <input id="query" placeholder="代码或名称"></label><label><input id="valid" type="checkbox" checked>扫描时未失效</label><div class="hint" id="count"></div></section>
<section class="scroll"><table><thead><tr><th>代码</th><th>名称</th><th>扫描时信号</th><th>扫描价</th><th>行业</th><th>信号结构日期</th><th>关键位</th><th>估算成交额（亿）</th></tr></thead><tbody id="rows"></tbody></table></section><small>点击个股查看保存的信号判据。新鲜度以扫描当时首次识别为准，不是距今天数。价格和信号不会自动更新。本站公开展示最近最多14个已导出批次。</small></main>
<dialog id="detail"><button id="close">关闭</button><h2 id="title"></h2><pre id="reason"></pre></dialog>
<script>
const $=id=>document.getElementById(id);let data={rows:[]},catalog=[],shown=[],generation=0;
function board(code){return /^30/.test(code)?'growth':/^68/.test(code)?'star':/^(60|00)/.test(code)?'main':/^(92|8|4)/.test(code)?'bse':''}
function cell(row,text){const td=document.createElement('td');td.textContent=text??'—';row.append(td)}
function signals(row){return [...(row.buy||[]),...(row.sell||[])].filter(s=>(!$('valid').checked||s.valid===1)&&Number(s.fresh??99)<=Number($('fresh').value)&&(!$('signal').value||s.type===$('signal').value))}
function render(){const q=$('query').value.trim().toLowerCase();shown=data.rows.filter(r=>(!$('board').value||board(r.code)===$('board').value)&&(!$('industry').value||r.industry===$('industry').value)&&(!q||String(r.code).includes(q)||String(r.name).toLowerCase().includes(q))&&signals(r).length);const body=$('rows');body.replaceChildren();shown.forEach((r,i)=>{const tr=document.createElement('tr');tr.dataset.row=i;const hs=signals(r);[r.code,r.name,hs.map(s=>s.type).join(' / '),r.close,r.industry,hs.map(s=>s.date).join(' / '),hs.map(s=>s.stop??'—').join(' / '),r.amt].forEach(v=>cell(tr,v));body.append(tr)});$('count').textContent=`筛选 ${shown.length} 只 / 本批次 ${data.rows.length} 只；点击一行可查看判据。`}
async function json(file){const response=await fetch(new URL(file,location.href));if(!response.ok)throw Error('数据获取失败：'+response.status);return response.json()}
async function load(){const ticket=++generation;$('meta').textContent='正在加载批次…';try{const result=await json($('batch').value);if(ticket!==generation)return;data=result;const ind=$('industry');ind.replaceChildren(new Option('全部行业',''));[...new Set(data.rows.map(r=>r.industry).filter(Boolean))].sort().forEach(s=>ind.add(new Option(s,s)));$('meta').textContent=`扫描时间 ${data.generated} · ${data.freq} · 扫描 ${data.total_scanned??'—'} 只 · 错误 ${data.errors} · 卖点版本 ${data.sell_rules_version||'未记录'}（全部为当时数据）`;render()}catch(e){if(ticket===generation){data={rows:[]};render();$('meta').textContent=e.message}}}
['board','signal','fresh','industry','valid'].forEach(id=>$(id).addEventListener('change',render));$('query').addEventListener('input',render);$('batch').addEventListener('change',load);$('close').onclick=()=>$('detail').close();$('rows').onclick=e=>{const tr=e.target.closest('tr[data-row]');if(!tr)return;const r=shown[tr.dataset.row];$('title').textContent=r.code+' '+r.name;$('reason').textContent=signals(r).map(s=>s.type+' · '+s.date+'\n'+(s.note||'')+'\n'+(s.why||[]).map(w=>`${w.ok?'✓':'×'} ${w.k}\n实测：${w.v}\n条件：${w.need}`).join('\n')).join('\n\n');$('detail').showModal()};
json('data/index.json').then(items=>{catalog=items;items.forEach(x=>$('batch').add(new Option(x.generated+' · '+x.count+'只',x.file)));if(!items.length)throw Error('尚无发布的扫描结果');return load()}).catch(e=>$('meta').textContent=e.message);
</script></html>
